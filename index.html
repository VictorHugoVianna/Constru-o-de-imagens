<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador de Imagens SeatMap</title>

https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.jsscript>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    gap:15px;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.actions{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:600;
}

.primary{
    background:#0078d4;
}

.success{
    background:#107c10;
}

.warning{
    background:#ff8c00;
}

.preview{
    margin-top:30px;
    text-align:center;
}

canvas{
    border:1px solid #ccc;
    background:white;
    max-width:100%;
}

.info{
    margin-top:15px;
    color:#666;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Gerador de Imagens SeatMap</h1>

<div class="grid">

<div>
<label>Texto da Imagem</label>
<input id="texto" value="AO">
</div>

<div>
<label>Textos em Lote (;)</label>
<input id="lote" placeholder="AA;AB;AC;AD">
</div>

<div>
<label>Tamanho da Imagem (px)</label>
<input id="tamanho" type="number" value="256">
</div>

<div>
<label>Cor de Fundo</label>
<input id="fundo" value="FFFFFF">
</div>

<div>
<label>Cor da Letra</label>
<input id="corTexto" value="333333">
</div>

<div>
<label>Nome da Imagem</label>
<input id="nome" placeholder="AO">
</div>

<div>
<label>Teatro</label>
<input id="teatro" placeholder="Teatro Riachuelo">
</div>

<div>
<label>Destino / Setor</label>
<input id="destino" placeholder="Plateia">
</div>

<div>
<label>Upload de Imagem</label>
<input id="upload" type="file" accept="image/*">
</div>

</div>

<div class="actions">

<button class="primary" onclick="gerarPreview()">
Gerar Preview
</button>

<button class="success" onclick="baixarImagem()">
Baixar PNG
</button>

<button class="warning" onclick="gerarLote()">
Gerar Lote (ZIP)
</button>

</div>

<div class="preview">
<canvas id="canvas"></canvas>

<div class="info">
A imagem será sempre quadrada e o texto será ajustado automaticamente ao espaço disponível.
</div>

</div>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let imagemUpload = null;

document.getElementById("upload").addEventListener("change", e => {

const file = e.target.files[0];

if(!file) return;

const img = new Image();

img.onload = () => {
    imagemUpload = img;
    gerarPreview();
};

img.src = URL.createObjectURL(file);

});

function desenhar(texto){

const tamanho =
parseInt(document.getElementById("tamanho").value) || 256;

canvas.width = tamanho;
canvas.height = tamanho;

const fundo =
"#" +
document.getElementById("fundo").value.replace("#","");

const corTexto =
"#" +
document.getElementById("corTexto").value.replace("#","");

ctx.clearRect(0,0,tamanho,tamanho);

ctx.fillStyle = fundo;
ctx.fillRect(0,0,tamanho,tamanho);

if(imagemUpload){

const menor =
Math.min(
imagemUpload.width,
imagemUpload.height
);

const sx =
(imagemUpload.width - menor)/2;

const sy =
(imagemUpload.height - menor)/2;

ctx.drawImage(
imagemUpload,
sx,
sy,
menor,
menor,
0,
0,
tamanho,
tamanho
);

}

if(texto){

let fonte = tamanho;

ctx.font = `bold ${fonte}px Arial`;

while(
ctx.measureText(texto).width >
tamanho * 0.8
){

fonte -= 2;

ctx.font = `bold ${fonte}px Arial`;

}

ctx.fillStyle = corTexto;
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
texto,
tamanho/2,
tamanho/2
);

}

}

function gerarPreview(){

const texto = document.getElementById("texto").value;

desenhar(texto);

}

function montarNome(texto){

const teatro =
document.getElementById("teatro")
.value
.trim();

const destino =
document.getElementById("destino")
.value
.trim();

const base =
document.getElementById("nome")
.value
.trim();

let partes = [];

if(teatro) partes.push(teatro);

if(destino) partes.push(destino);

if(base){

partes.push(base);

}else{

partes.push(texto);

}

return partes
.join("_")
.replaceAll(" ","_");

}

function baixarImagem(){

const texto =
document.getElementById("texto")
.value
.trim();

if(!texto){

alert("Informe um texto.");

return;

}

gerarPreview();

let nome = montarNome(texto);

const link =
document.createElement("a");

link.download =
nome + ".png";

link.href =
canvas.toDataURL("image/png");

link.click();

}

async function gerarLote(){

const lote =
document.getElementById("lote")
.value
.trim();

if(!lote){

alert("Informe os textos separados por ;");

return;

}

const zip = new JSZip();

const itens =
lote
.split(";")
.map(x => x.trim())
.filter(x => x !== "");

for(const item of itens){

desenhar(item);

const base64 =
canvas
.toDataURL("image/png")
.split(",")[1];

zip.file(
montarNome(item) + ".png",
base64,
{
base64:true
}
);

}

const arquivo =
await zip.generateAsync({
type:"blob"
});

const link =
document.createElement("a");

link.href =
URL.createObjectURL(arquivo);

link.download =
"seatmaps.zip";

link.click();

}

gerarPreview();

</script>

</body>

</html>
