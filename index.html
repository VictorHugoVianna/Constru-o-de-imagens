<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador de Imagens SeatMap</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.actions{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:600;
}

.btn-primary{
    background:#0078d4;
}

.btn-success{
    background:#107c10;
}

.btn-warning{
    background:#ff8c00;
}

.btn-danger{
    background:#d13438;
}

.preview{
    text-align:center;
    margin-top:25px;
}

canvas{
    border:1px solid #ccc;
    max-width:100%;
    background:white;
}

.info{
    margin-top:12px;
    color:#666;
    font-size:14px;
}

@media(max-width:768px){

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h1>Gerador de Imagens SeatMap</h1>

<div class="grid">

<div>
<label>Texto da Imagem</label>
<input id="texto" value="AO">
</div>

<div>
<label>Geração em Lote (;)</label>
<input id="lote" placeholder="AA;AB;AC;AD">
</div>

<div>
<label>Tamanho da Imagem (px)</label>
<input id="tamanho" type="number" value="256">
</div>

<div>
<label>Cor de Fundo (HEX)</label>
<input id="corFundo" value="FFFFFF">
</div>

<div>
<label>Cor da Letra (HEX)</label>
<input id="corTexto" value="333333">
</div>

<div>
<label>Nome Base da Imagem</label>
<input id="nomeImagem" placeholder="Opcional">
</div>

<div>
<label>Teatro</label>
<input id="teatro" placeholder="Teatro Riachuelo">
</div>

<div>
<label>Destino / Setor</label>
<input id="destino" placeholder="Plateia">
</div>

<div>
<label>Upload de Imagem</label>
<input id="uploadImagem" type="file" accept="image/*">
</div>

</div>

<div class="actions">

<button class="btn-primary" onclick="gerarPreview()">
Gerar Preview
</button>

<button class="btn-success" onclick="baixarImagem()">
Baixar PNG
</button>

<button class="btn-warning" onclick="gerarLote()">
Gerar Lote
</button>

<button class="btn-danger" onclick="limparTudo()">
Limpar
</button>

</div>

<div class="preview">

<canvas id="canvas"></canvas>

<div class="info">
A imagem será sempre quadrada e o texto será ajustado automaticamente.
</div>

</div>

</div>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let imagemCarregada = null;

document
.getElementById('uploadImagem')
.addEventListener('change', function(e){

    const arquivo = e.target.files[0];

    if(!arquivo) return;

    const img = new Image();

    img.onload = function(){

        imagemCarregada = img;
        gerarPreview();

    };

    img.src = URL.createObjectURL(arquivo);

});

function obterCor(id){

    let valor =
    document
    .getElementById(id)
    .value
    .trim()
    .replace('#','');

    return '#' + valor;

}

function desenharImagem(texto){

    const tamanho =
    parseInt(
    document.getElementById('tamanho').value
    ) || 256;

    canvas.width = tamanho;
    canvas.height = tamanho;

    const corFundo = obterCor('corFundo');
    const corTexto = obterCor('corTexto');

    ctx.clearRect(0,0,tamanho,tamanho);

    ctx.fillStyle = corFundo;
    ctx.fillRect(0,0,tamanho,tamanho);

    if(imagemCarregada){

        const menorLado =
        Math.min(
            imagemCarregada.width,
            imagemCarregada.height
        );

        const sx =
        (imagemCarregada.width - menorLado) / 2;

        const sy =
        (imagemCarregada.height - menorLado) / 2;

        ctx.drawImage(
            imagemCarregada,
            sx,
            sy,
            menorLado,
            menorLado,
            0,
            0,
            tamanho,
            tamanho
        );

    }

    if(texto){

        let fonte = tamanho;

        do{

            fonte -= 2;

            ctx.font =
            `bold ${fonte}px Arial`;

        }
        while(
            ctx.measureText(texto).width >
            tamanho * 0.8 &&
            fonte > 10
        );

        ctx.fillStyle = corTexto;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            texto,
            tamanho/2,
            tamanho/2
        );

    }

}

function gerarPreview(){

    const texto =
    document
    .getElementById('texto')
    .value
    .trim();

    desenharImagem(texto);

}

function montarNome(texto){

    const teatro =
    document.getElementById('teatro').value.trim();

    const destino =
    document.getElementById('destino').value.trim();

    const nomeBase =
    document.getElementById('nomeImagem').value.trim();

    let partes = [];

    if(teatro) partes.push(teatro);

    if(destino) partes.push(destino);

    if(nomeBase){

        partes.push(nomeBase);

    }else{

        partes.push(texto);

    }

    return partes
    .join('_')
    .replace(/\s+/g,'_');

}

function baixarImagem(){

    const texto =
    document.getElementById('texto').value.trim();

    if(!texto){

        alert("Informe um texto.");

        return;
    }

    gerarPreview();

    const link =
    document.createElement('a');

    link.download =
    montarNome(texto) + ".png";

    link.href =
    canvas.toDataURL('image/png');

    link.click();

}

function gerarLote(){

    const lote =
    document.getElementById('lote')
    .value
    .trim();

    if(!lote){

        alert("Informe os textos separados por ;");

        return;
    }

    const itens =
    lote
    .split(';')
    .map(x => x.trim())
    .filter(x => x !== '');

    let atraso = 0;

    itens.forEach(item => {

        setTimeout(() => {

            desenharImagem(item);

            const link =
            document.createElement('a');

            link.download =
            montarNome(item) + '.png';

            link.href =
            canvas.toDataURL('image/png');

            link.click();

        }, atraso);

        atraso += 300;

    });

}

function limparTudo(){

    document.getElementById('texto').value = '';
    document.getElementById('lote').value = '';
    document.getElementById('nomeImagem').value = '';
    document.getElementById('teatro').value = '';
    document.getElementById('destino').value = '';

    imagemCarregada = null;

    document.getElementById('uploadImagem').value = '';

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

gerarPreview();

</script>

</body>
</html>
